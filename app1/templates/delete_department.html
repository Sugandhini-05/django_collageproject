{% extends 'base.html' %}

{% block content %}
<h2 class="text-white">Delete Department</h2>

<div class="card p-4">
    <p>Are you sure you want to delete <b>{{ dept.name }}</b>?</p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="password" name="password" class="form-control mb-3" placeholder="Enter Admin Password">
        <button class="btn btn-danger">Confirm Delete</button>
    </form>
</div>
{% endblock %}
